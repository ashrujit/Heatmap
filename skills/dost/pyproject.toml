[project]
name = "dost"
version = "0.1.0"
description = "LevelLedger ownership MCP server for Dost"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "polars>=1.20.0",
    "tzdata>=2024.1",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dost"]
