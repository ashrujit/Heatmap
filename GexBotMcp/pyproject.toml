[project]
name = "gexbot-mcp"
version = "0.1.0"
description = "GexBot options-context MCP adapter for Heatmap workflows"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gexbot_mcp"]
